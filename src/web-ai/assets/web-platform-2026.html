<title>Web Platform 2026</title>

<style>
body { max-inline-size: none; margin: 0; padding-block: var(--space-block-small); padding-inline: var(--space-inline-large); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 16rem; gap: var(--space-inline-large); }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
header { grid-column: 1 / -1; }
header h1 { margin-block-end: var(--space-block-tiny); }
header p { margin-block: 0; color: var(--color-text-secondary); font-size: var(--text-small); }
main { overflow: auto; }
#map { inline-size: 100%; min-inline-size: 1280px; block-size: auto; display: block; font-family: inherit; }
#map text { text-anchor: middle; pointer-events: none; }
.grp { cursor: pointer; }
.grp circle { fill: color-mix(in oklch, var(--c) 7%, white); stroke: none; transition: fill .2s; }
.grp text { font-size: 26px; font-weight: bold; fill: var(--c); }
.grp:hover circle, .grp:focus-visible circle, .grp.on circle { fill: color-mix(in oklch, var(--c) 16%, white); }
.grp:focus-visible circle { stroke: var(--c); stroke-width: 3; }
.loose { font-size: 18px; fill: var(--color-text-secondary); }
.item { cursor: pointer; transition: opacity .2s; }
.item circle { fill: white; stroke: color-mix(in oklch, var(--c) 45%, white); stroke-width: 1.5; transition: fill .15s; }
.item text { fill: var(--color-text); }
.item:hover circle, .item:focus-visible circle { fill: color-mix(in oklch, var(--c) 18%, white); stroke: var(--c); }
.item.sel circle { fill: var(--c); stroke: var(--c); }
.item.sel text { fill: white; }
#map :focus { outline: none; }
#map.filtering .item:not(.hit) { opacity: .15; }
#map.filtering .grp:not(.hit) circle { fill: color-mix(in oklch, var(--c) 3%, white); }
aside { position: sticky; inset-block-start: var(--space-block-small); align-self: start; font-size: var(--text-small); }
aside h2 { font-size: var(--text-small); font-weight: bold; color: var(--color-text-secondary); margin-block: var(--space-block-small) var(--space-block-tiny); }
.uses { display: grid; gap: var(--space-block-tiny); }
.use { text-align: start; font-weight: normal; color: var(--color-text); padding-block: var(--space-block-tiny); background: white; border-color: transparent; }
.use[aria-pressed="true"] { color: white; background: var(--color-primary); }
.use[aria-pressed="true"]:not(:disabled):hover { background: var(--color-primary-dark); }
.count { color: var(--color-text-secondary); min-block-size: 1lh; margin-block: var(--space-block-tiny) 0; }
#detail { background: white; border-radius: var(--radius); padding-block: var(--space-block-small); padding-inline: var(--space-inline-default); border-inline-start: 4px solid var(--c, var(--color-border)); min-block-size: 8lh; }
#detail h3 { margin-block: 0; font-size: var(--text-large); font-weight: bold; line-height: var(--leading-small); }
#detail .grpname { color: var(--c); font-weight: bold; }
#detail p { margin-block: var(--space-block-small) 0; }
#detail .chips { display: flex; flex-wrap: wrap; gap: var(--space-block-tiny); margin-block-start: var(--space-block-small); }
#detail .chips span { background: var(--color-surface); border-radius: 1lh; padding-inline: .6em; }
.hint { color: var(--color-text-secondary); }
footer { color: var(--color-text-secondary); margin-block-start: var(--space-block-default); }
</style>
</head>

<p>標準化団体と仕様ごとに主な機能を並べた全体像（199 項目）。円をクリックすると説明が出ます。</p>
</header>

function apply() {
  map.classList.toggle("filtering", !!filter);
  let n = 0;
  for (const el of items) {
    const it = DATA.items[el.id];
    const hit = !filter ? false
      : filter.kind === "use" ? it.uses.includes(filter.value)
      : it.group === filter.value;

  const uses = it.uses.map(u => `<span>${DATA.uses[u]}</span>`).join("");

function showGroup(k) {
  items.forEach(x => x.classList.remove("sel"));
  const g = DATA.groups[k];
  detail.style.setProperty("--c", g.color);
  detail.innerHTML = `<h3></h3><p></p>`;
  detail.querySelector("h3").textContent = g.name;
  detail.querySelector("p").textContent = g.desc;
}

const activate = (el, fn) => {
  el.addEventListener("click", fn);
  el.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } });
};
items.forEach(el => activate(el, () => showItem(el)));
grps.forEach(el => activate(el, () => {
  const k = el.dataset.group;
  filter = filter?.kind === "group" && filter.value === k ? null : { kind: "group", value: k };
  showGroup(k); apply();
}));
document.querySelectorAll(".use").forEach(b => b.addEventListener("click", () => {
  filter = filter?.kind === "use" && filter.value === b.dataset.use ? null : { kind: "use", value: b.dataset.use };
  apply();
}));
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { filter = null; apply(); } });
</script>
</body>
</html>
