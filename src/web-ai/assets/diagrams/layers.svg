<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#353c48"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a51d3c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9cbcf"/></marker></defs>
<rect x="10" y="130" width="200" height="120" fill="#ffffff" stroke="#a51d3c" stroke-width="2.5"/>
<text x="110" y="172" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="22" font-weight="700" fill="#a51d3c" text-anchor="middle">モデルの出力</text>
<text x="110" y="208" font-family="'Source Code Pro', 'Noto Sans Mono CJK JP', monospace" font-size="20" fill="#353c48" text-anchor="middle">grip を</text>
<text x="110" y="234" font-family="'Source Code Pro', 'Noto Sans Mono CJK JP', monospace" font-size="20" fill="#353c48" text-anchor="middle">set 180</text>
<g>
<rect x="270" y="60" width="260" height="280" fill="#ffffff" stroke="#353c48" stroke-width="2.5"/>
<text x="400.0" y="106" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="26" font-weight="700" fill="#353c48" text-anchor="middle">1 スキーマ</text>
<text x="400.0" y="150" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">形と変え方の候補</text>
<text x="400.0" y="180" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">値は −180〜180度</text>
<line x1="290" y1="215" x2="510" y2="215" stroke="#c9cbcf" stroke-width="1.5"/>
<text x="400.0" y="256" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#353c48" text-anchor="middle">180 は範囲内</text>
<text x="400.0" y="300" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="26" font-weight="700" fill="#353c48" text-anchor="middle">→ 通る</text>
</g>
<g>
<rect x="560" y="60" width="260" height="280" fill="#ffffff" stroke="#a51d3c" stroke-width="4"/>
<text x="690.0" y="106" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="26" font-weight="700" fill="#353c48" text-anchor="middle">2 JavaScript</text>
<text x="690.0" y="150" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">記録した可動範囲</text>
<text x="690.0" y="180" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">40〜120度</text>
<line x1="580" y1="215" x2="800" y2="215" stroke="#c9cbcf" stroke-width="1.5"/>
<text x="690.0" y="256" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#353c48" text-anchor="middle">180 は範囲外</text>
<text x="690.0" y="300" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="26" font-weight="700" fill="#a51d3c" text-anchor="middle">ここで止める</text>
</g>
<g opacity="0.55">
<rect x="850" y="60" width="260" height="280" fill="#ffffff" stroke="#c9cbcf" stroke-width="2.5"/>
<text x="980.0" y="106" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="26" font-weight="700" fill="#353c48" text-anchor="middle">3 Core2 側</text>
<text x="980.0" y="150" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">受け付ける範囲</text>
<text x="980.0" y="180" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">0〜180度</text>
<line x1="870" y1="215" x2="1090" y2="215" stroke="#c9cbcf" stroke-width="1.5"/>
<text x="980.0" y="285" font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Source Han Sans JP', sans-serif" font-size="26" font-weight="700" fill="#6b7280" text-anchor="middle">ここまで届かない</text>
</g>
<line x1="214" y1="190" x2="264" y2="190" stroke="#a51d3c" stroke-width="4" marker-end="url(#ar)"/>
<line x1="534" y1="190" x2="554" y2="190" stroke="#a51d3c" stroke-width="4" marker-end="url(#ar)"/>
<line x1="824" y1="190" x2="844" y2="190" stroke="#c9cbcf" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#ag)"/>
