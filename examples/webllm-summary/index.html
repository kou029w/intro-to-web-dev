<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebLLMで日本語を要約する</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>WebLLMで日本語を要約する</h1>
      <p id="status">対応状況を確認しています…</p>

      <form id="form">
        <label>
          要約する文章
          <textarea id="input" rows="6" required>
市立図書館は来月から平日の閉館時刻を午後6時から午後8時に変更します。仕事や学校の帰りに利用したいという要望に応えるためです。土日祝日の開館時間は変更しません。試行期間は3か月で、利用者数とアンケートをもとに継続を判断します。</textarea
          >
        </label>
        <div class="buttons">
          <button id="generate" type="submit" disabled>要約する</button>
          <button id="stop" type="button" disabled>停止</button>
        </div>
      </form>

      <output id="output"></output>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
