<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>声でサーボモーターを動かす</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>声でサーボモーターを動かす</h1>
      <p id="status">対応状況を確認しています…</p>

      <button id="connect" type="button">M5Stackに接続</button>
      <p>接続しなくても、画面上の角度だけで動作を試せます。</p>

      <h2>現在の角度</h2>
      <table>
        <tbody id="joints"></tbody>
      </table>

      <h2>指示する</h2>
      <button id="talk" type="button">話す</button>
      <p id="heard"></p>
      <form id="text-form">
        <input
          id="text"
          type="text"
          placeholder="もう少し右に向けて"
          autocomplete="off"
          aria-label="指示"
        />
        <button type="submit">送信</button>
      </form>

      <h2>処理の流れ</h2>
      <table>
        <thead>
          <tr>
            <th>指示</th>
            <th>モデルの出力</th>
            <th>送信したコマンド</th>
          </tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
