<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>画像を説明してもらう</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fogtype/css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>画像を説明してもらう</h1>
      <p id="status">対応状況を確認しています…</p>

      <form id="form">
        <label>
          画像ファイル
          <input id="file" type="file" accept="image/*" required />
        </label>
        <img id="preview" alt="選択した画像のプレビュー" hidden />
        <label>
          質問
          <textarea id="prompt">
この画像には何が写っていますか？日本語で説明してください。</textarea
          >
        </label>
        <button type="submit">送信</button>
      </form>

      <pre id="output"></pre>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
